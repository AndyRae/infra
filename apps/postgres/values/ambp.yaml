postgres:
  persistence:
    storageClass: local-path
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  auth:
    existingSecret: postgres-auth
  # Sealed by kubeseal against ambp's sealed-secrets controller — ciphertext only,
  # decrypts to a `postgres-auth` Secret with key `postgres-password`.
  extraObjects:
    - apiVersion: bitnami.com/v1alpha1
      kind: SealedSecret
      metadata:
        name: postgres-auth
        namespace: postgres
      spec:
        encryptedData:
          postgres-password: 
        template:
          metadata:
            name: postgres-auth
            namespace: postgres
