kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      retention: 3d
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 5Gi
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi
  alertmanager:
    alertmanagerSpec:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
  grafana:
    persistence:
      enabled: true
      type: sts
      storageClassName: local-path
      accessModes: ["ReadWriteOnce"]
      size: 1Gi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    admin:
      existingSecret: grafana-auth
      userKey: admin-user
      passwordKey: admin-password
    # Sealed by kubeseal against ambp's sealed-secrets controller — ciphertext only,
    # decrypts to a `grafana-auth` Secret with keys `admin-user`/`admin-password`.
    extraObjects:
      - apiVersion: bitnami.com/v1alpha1
        kind: SealedSecret
        metadata:
          name: grafana-auth
          namespace: monitoring
          annotations:
            # sealed-secrets' CRD schema is too loosely typed for server-side apply's
            # strict field validation (rejects spec.template) — fall back to client-side
            # apply for just this resource, even though the Application uses SSA overall
            # (needed for the huge prometheus-operator CRDs, see CLAUDE.md Milestone 7 note).
            argocd.argoproj.io/sync-options: ServerSideApply=false
        spec:
          encryptedData:
            admin-password: 
            admin-user: 
        template:
          metadata:
            name: grafana-auth
            namespace: monitoring
