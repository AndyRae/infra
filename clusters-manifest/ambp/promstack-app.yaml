apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: promstack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AndyRae/infra.git
    targetRevision: main
    path: apps/promstack
    helm:
      valueFiles:
        - values/ambp.yaml
      # The prometheus-operator CRDs are large enough to break both client-side apply
      # (last-applied-configuration annotation limit) and, if forced to server-side
      # apply/diff at the Application level, the sealed-secrets CRD's diffing (its
      # loosely-typed spec.template field isn't valid under structured/server-side
      # diffing). Simplest fix: don't have ArgoCD manage crds/ at all — they were
      # installed once manually (`kubectl apply --server-side --force-conflicts`,
      # see CLAUDE.md Milestone 7 note) and Helm's own crds/ convention says they're
      # only ever touched on first install anyway, never on upgrade.
      skipCrds: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
