apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: promstack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AndyRae/infra.git
    targetRevision: main
    path: apps/promstack
    helm:
      valueFiles:
        - values/ambp.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  # Application-level ServerSideApply=true (needed for the huge prometheus-operator
  # CRDs) also switches ArgoCD's diff engine to structured/server-side diffing, which
  # errors on the sealed-secrets CRD's loosely-typed spec.template field even though
  # the resource itself applies fine (per-resource ServerSideApply=false override on
  # the resource only affects apply, not comparison). Exclude the field from diffing.
  ignoreDifferences:
    - group: bitnami.com
      kind: SealedSecret
      jsonPointers:
        - /spec/template
